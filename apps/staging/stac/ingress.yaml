  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/hostname: stac.staging.piksel.big.go.id
spec:
  ingressClassName: nginx
  rules:
    - host: stac.staging.piksel.big.go.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stac-browser
                port:
                  name: http
  tls:
    - hosts:
        - stac.staging.piksel.big.go.id
      secretName: stac-browser-ingress-tls  # pragma: allowlist secret

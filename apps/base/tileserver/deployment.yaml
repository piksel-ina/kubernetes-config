apiVersion: apps/v1
kind: Deployment
metadata:
  name: tileserver
  namespace: tileserver
  labels:
    app: tileserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tileserver
  template:
    metadata:
      labels:
        app: tileserver
    spec:
      containers:
        - name: tileserver
          image: maptiler/tileserver-gl:v5.6.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/config/config.json"
            - "--public_url"
            - "https://tiles.staging.piksel.big.go.id/"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - configMap:
            name: tileserver-config
          name: config
                  "name": "GeoMAD Tahunan",
                  "description": "Ringkasan tahunan dari seluruh citra Sentinel-2 sepanjang satu tahun, dihitung dengan metode GeoMAD (Geometric Median and Median Absolute Deviation). Setiap piksel diwakili oleh satu nilai representatif dari semua pengamatan pada tahun tersebut. Produk ini relatif bersih dari awan dan bayangan, sehingga kondisi permukaan bumi lebih mudah diamati.",
                  "members": [
                    {
                      "id": "s2-geomad-spectral",
                      "type": "wms",
                      "name": "Citra Geomedian Tahunan",
                      "url": "https://ows.staging.piksel.big.go.id/wms",
                      "layers": "s2_geomad_annual_spectral",
                      "opacity": 0.8,
                      "description": "Kanal spektral Sentinel-2 dalam komposit geomedian tahunan, tersedia dalam tampilan RGB warna alami, false colour near infrared yang menonjolkan vegetasi, dan false colour red edge yang lebih sensitif terhadap kondisi vegetasi.",
                      "tileErrorHandlingOptions": {
                        "thresholdBeforeDisablingItem": 20,
                        "ignoreUnknownTileErrors": true
                      }
                    },
                    {
                      "id": "s2-geomad-indices",
                      "type": "wms",
                      "name": "Indeks Spektral Tahunan",
                      "url": "https://ows.staging.piksel.big.go.id/wms",
                      "layers": "s2_geomad_annual_indices",
                      "opacity": 0.8,
                      "description": "Indeks yang dihitung dari komposit geomedian tahunan. NDVI dan NDVI Red Edge lebih peka terhadap vegetasi, NDWI dan MNDWI terhadap air, NDMI terhadap kelembapan, NDBI terhadap lahan terbangun, dan BSI terhadap tanah terbuka.",
                      "tileErrorHandlingOptions": {
                        "thresholdBeforeDisablingItem": 20,
                        "ignoreUnknownTileErrors": true
                      }
                    },
                    {
                      "id": "s2-geomad-statistics",
                      "type": "wms",
                      "name": "Statistik MAD Tahunan",
                      "url": "https://ows.staging.piksel.big.go.id/wms",
                      "layers": "s2_geomad_annual_statistics",
                      "opacity": 0.8,
                      "description": "Ukuran simpangan nilai piksel terhadap komposit geomedian sepanjang satu tahun. Nilai tinggi menandai lokasi yang banyak berubah, nilai rendah menandai lokasi yang stabil.\n\n- **EMAD** lebih peka terhadap perubahan tingkat kecerahan pantulan. Berguna untuk menelusuri genangan dan banjir, hilangnya vegetasi, serta pembukaan lahan, dan untuk memisahkan permukaan yang stabil dari yang dinamis.\n- **SMAD** lebih peka terhadap perubahan bentuk pantulan antarkanal, yaitu perubahan jenis tutupan lahan. Karena tidak terpengaruh perbedaan kecerahan, perubahan tetap terlihat meski tingkat kecerahannya mirip. Cocok untuk memantau alih fungsi lahan dan menelusuri tubuh air, yang pantulannya sangat bervariasi.\n- **BCMAD** menonjolkan perbedaan pada setiap kanal secara proporsional. Nilainya berkisar 0 sampai 1 sehingga sebanding antarlokasi dan antartahun, dan biasa dipakai bersama EMAD dan SMAD sebagai masukan klasifikasi tutupan lahan.\n- **Count** menunjukkan berapa banyak pengamatan yang tersedia di setiap piksel sepanjang tahun. Nilai rendah berarti geomedian dan MAD di lokasi itu dihitung dari sedikit pengamatan sehingga perlu dibaca lebih hati-hati, misalnya di wilayah yang sering tertutup awan. Nilai tertinggi biasanya berada di area tumpang tindih lintasan satelit.\n\nTersedia juga tampilan ternary MAD RGB yang menggabungkan ketiga MAD dalam satu citra.",
                      "tileErrorHandlingOptions": {
                        "thresholdBeforeDisablingItem": 20,
                        "ignoreUnknownTileErrors": true
                      }

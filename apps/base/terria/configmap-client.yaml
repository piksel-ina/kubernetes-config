      "catalog": [
        {
          "id": "surface-reflectance-group",
          "type": "group",
          "name": "Data Satelit Optik",
          "description": "Data dari satelit optik, yaitu satelit yang merekam cahaya matahari yang dipantulkan permukaan bumi. Karena bergantung pada cahaya matahari, perekaman hanya berlangsung pada siang hari dan dapat terhalang awan. Kelompok ini mencakup citra dari arsip penyedia data maupun produk hasil pengolahannya.",
          "members": [
            {
              "id": "s2_l2a",
              "type": "group",
              "name": "Arsip Citra Publik",
              "description": "Citra multispektral yang diakses langsung dari arsip publik Sentinel-2 dan USGS Landsat di Oregon, Amerika Serikat. Daftar citra terbaru diperbarui setiap hari saat data baru tersedia. Pemuatan awal mungkin membutuhkan waktu lebih lama karena data dibaca langsung dari arsip publik.",
              "members": [
                {
                  "id": "s2-l2a",
                  "name": "Sentinel-2 (2017-sekarang)",
                  "type": "wms",
                  "url": "https://ows.staging.piksel.big.go.id/wms",
                  "layers": "s2_l2a",
                  "opacity": 0.8,
                  "description": "Citra Sentinel-2 Level-2A yang telah dikoreksi atmosfer, dengan resolusi spasial hingga 10 meter. Sentinel-2 umumnya melintasi wilayah yang sama setiap 5 hari.",
                  "tileErrorHandlingOptions": {
                    "thresholdBeforeDisablingItem": 20,
                    "ignoreUnknownTileErrors": true
                  }
                },
                {
                  "id": "landsat-surface-reflectance",
                  "type": "group",
                  "name": "Landsat",
                  "description": "Arsip citra Landsat Collection 2 Level-2 dari USGS dengan resolusi spasial 30 meter. Landsat 5 menyediakan arsip terlama (1986-2011); Landsat 7 melanjutkan rekaman hingga 2024; sedangkan Landsat 8 (sejak 2013) dan Landsat 9 (sejak 2021) menyediakan pengamatan terkini dengan sensor generasi lebih baru. Setiap satelit Landsat umumnya melintasi wilayah yang sama setiap 16 hari. Landsat 8 dan 9 dikonfigurasi untuk menggunakan jalur lintasan yang sama dengan selisih 8 hari, sehingga bila digunakan bersamaan, wilayah yang sama dapat terekam setiap 8 hari.",

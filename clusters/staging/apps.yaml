# --- Applications Kustomization for the staging cluster ---
# argo-workflows
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: argo-workflows
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: infra-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging/argo
  prune: true
  wait: true
  timeout: 5m0s
---
# OWS (scaled to 0; kept for daily-satellite-orchestrator restart-ows step)
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: ows
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: infra-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging/datacube-ows
  prune: true
  wait: true
  timeout: 5m0s
---
# the-workflows
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: workflows-templates
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: argo-workflows
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workflows/templates
  prune: true
  wait: true
  timeout: 5m0s

---
# cron-workflows
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: cron-jobs
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: argo-workflows
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workflows/cronwf
  prune: true
  wait: true
  timeout: 5m0s

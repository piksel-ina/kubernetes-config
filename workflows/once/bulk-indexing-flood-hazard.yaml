# Flood Hazard (Bahaya Banjir 2025) Workflows
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: flood-hazard-index-
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflows-executor
  workflowTemplateRef:
    name: odc-s3-indexer
  arguments:
    parameters:
      - name: s3-uri
        value: "s3://piksel-staging-public-data/flood_hazard/1.0.0/**/*.stac-item.json"
      - name: product-name
        value: "flood_hazard"
      - name: rename-product
        value: "flood_hazard"
      - name: aws-region
        value: "ap-southeast-3"
      - name: no-sign-request
        value: "true"

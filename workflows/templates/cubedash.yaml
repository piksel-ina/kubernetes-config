apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cubedash-refresh
  namespace: argo-workflows
  labels:
    app: explorer
    component: cubedash-gen
spec:
  serviceAccountName: argo-workflows-executor
  entrypoint: cubedash-refresh
  podGC:
    strategy: OnPodCompletion
  podMetadata:
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    labels:
      app: daily-cubedash
  ttlStrategy:
    secondsAfterCompletion: 300
  arguments:
    parameters:
      - name: operation
        value: "refresh" # options: refresh, force-refresh
  templates:
    # Refreshes Explorer's product summaries. Runs as the odc user (member of
    # odc_manage, which holds insert/update/delete on the cubedash schema) via
    # the transaction-pooled odc_index alias.
    #
    # Schema creation is NOT handled here — it requires odc_admin membership and
    # lives in the one-time workflows/once/cubedash-initialization.yaml.
    - name: cubedash-refresh
      inputs:
        parameters:
          - name: operation
      script:
        image: 686410905891.dkr.ecr.ap-southeast-3.amazonaws.com/dc-explorer:v20260721-1356
        command: [bash]
        source: |
          #!/bin/bash
          case "{{inputs.parameters.operation}}" in
            "refresh")
              cubedash-gen --all
              ;;
            "force-refresh")
              cubedash-gen --force-refresh --refresh-stats --all
              ;;
            *)
              echo "Invalid operation: {{inputs.parameters.operation}}"
              echo "Valid operations: refresh, force-refresh"
              echo "(Schema init lives in workflows/once/cubedash-initialization.yaml)"
              exit 1
              ;;
          esac
        env:
          - name: ODC_DEFAULT_DB_HOSTNAME
            value: "pg-proxy-service.database.svc.cluster.local"
          - name: ODC_DEFAULT_DB_PORT
            value: "6432"
          - name: ODC_DEFAULT_DB_DATABASE
            value: "odc_index"
          - name: ODC_DEFAULT_DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: odc
                key: username
          - name: ODC_DEFAULT_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: odc
                key: password
          - name: ODC_DEFAULT_INDEX_DRIVER
            value: "postgis"
          - name: ODC_POSTGIS_INDEX_DRIVER
            value: "postgis"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      retryStrategy:
        limit: 5
        retryPolicy: "Always"
        backoff:
          duration: "1m"
          factor: 2
          maxDuration: "10m"

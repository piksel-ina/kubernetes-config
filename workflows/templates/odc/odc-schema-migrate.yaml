apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: odc-schema-migrate
  namespace: argo-workflows
  annotations:
    description: "Run datacube schema migration (idempotent). Use: argo submit --from workflowtemplate/odc-schema-migrate"
spec:
  serviceAccountName: argo-workflows-executor
  entrypoint: migrate
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowSuccess
  podMetadata:
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    labels:
      app: odc-schema-migrate
  volumes:
    - name: rds-ca
      configMap:
        name: rds-ca-cert
  templates:
    - name: migrate
      steps:
        - - name: schema-init
            template: schema-init

        - - name: grant-roles
            template: grant-roles

    - name: schema-init
      container:
        name: odc
        image: 686410905891.dkr.ecr.ap-southeast-3.amazonaws.com/inadc-core:v20260429-1009
        command: [bash, -c]
        args:
          - |
            set -e
            export PGSSLMODE=verify-ca
            export PGSSLROOTCERT=/tmp/rds-ca/ap-southeast-3-bundle.pem

            echo "=== ODC Schema Migration ==="
            datacube --version
            echo ""
            echo "Running datacube system init (idempotent)..."
            datacube -v system init
            echo ""
            echo "Running system check..."
            datacube system check
            echo ""
            echo "✓ Schema migration complete"
        env:
          - name: ODC_DEFAULT_DB_HOSTNAME
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: db_address
          - name: ODC_DEFAULT_DB_PORT
            value: "5432"
          - name: ODC_DEFAULT_DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: username
          - name: ODC_DEFAULT_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: password
          - name: ODC_DEFAULT_DB_DATABASE
            value: "odc"
          - name: ODC_DEFAULT_INDEX_DRIVER
            value: "postgis"
        volumeMounts:
          - name: rds-ca
            mountPath: /tmp/rds-ca
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

    - name: grant-roles
      container:
        name: odc
        image: 686410905891.dkr.ecr.ap-southeast-3.amazonaws.com/inadc-core:v20260429-1009
        command: [bash, -c]
        args:
          - |
            set -e
            export PGSSLMODE=verify-ca
            export PGSSLROOTCERT=/tmp/rds-ca/ap-southeast-3-bundle.pem

            echo "=== Granting ODC roles ==="
            # Use raw SQL instead of `datacube user grant`: the CLI swallows
            # grant failures (contextlib.suppress + unchecked return) and can
            # report a false success while leaving services without permissions.
            # Master owns odc_user/odc_manage (created via system init), so on
            # PG16+ it can grant them directly.
            PGPASSWORD="$ODC_DEFAULT_DB_PASSWORD" psql \
              -h "$ODC_DEFAULT_DB_HOSTNAME" -p "$ODC_DEFAULT_DB_PORT" \
              -U "$ODC_DEFAULT_DB_USERNAME" -d "$ODC_DEFAULT_DB_DATABASE" \
              -v ON_ERROR_STOP=1 \
              -c "GRANT odc_manage TO odc; GRANT odc_user TO odcread;"

            # Verify membership actually landed (guards against silent regression).
            for pair in "odc:odc_manage" "odcread:odc_user"; do
              u="${pair%%:*}"; r="${pair##*:}"
              ok=$(PGPASSWORD="$ODC_DEFAULT_DB_PASSWORD" psql \
                    -h "$ODC_DEFAULT_DB_HOSTNAME" -p "$ODC_DEFAULT_DB_PORT" \
                    -U "$ODC_DEFAULT_DB_USERNAME" -d "$ODC_DEFAULT_DB_DATABASE" \
                    -tAc "SELECT pg_has_role('$u', '$r', 'MEMBER');")
              [ "$ok" = "t" ] || { echo "ERROR: $u is not a member of $r after grant"; exit 1; }
              echo "✓ $r granted to $u"
            done
        env:
          - name: ODC_DEFAULT_DB_HOSTNAME
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: db_address
          - name: ODC_DEFAULT_DB_PORT
            value: "5432"
          - name: ODC_DEFAULT_DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: username
          - name: ODC_DEFAULT_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: password
          - name: ODC_DEFAULT_DB_DATABASE
            value: "odc"
          - name: ODC_DEFAULT_INDEX_DRIVER
            value: "postgis"
        volumeMounts:
          - name: rds-ca
            mountPath: /tmp/rds-ca
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

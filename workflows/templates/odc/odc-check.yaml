apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: odc-check
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflows-executor
  entrypoint: odc-check
  podGC:
    strategy: OnPodCompletion
  ttlStrategy:
    secondsAfterCompletion: 300
  arguments:
    parameters:
      - name: products
        value: ""
  templates:
    - name: odc-check
      inputs:
        parameters:
          - name: products
      container:
        image: 686410905891.dkr.ecr.ap-southeast-3.amazonaws.com/inadc-core:v20260429-1009
        command: [bash, -c]
        args:
          - |
            if [ -z "{{inputs.parameters.products}}" ]; then
              echo "=== All Products ==="
              datacube product list
              echo ""
              echo "=== Dataset Counts ==="
              for p in $(datacube product list --format csv 2>/dev/null | tail -n +2 | cut -d',' -f1); do
                datacube dataset count $p
              done
            else
              for p in {{inputs.parameters.products}}; do
                datacube dataset count $p
              done
            fi
            echo ""
            datacube system check
        env:
          - name: ODC_DEFAULT_DB_HOSTNAME
            value: "pg-proxy-service.database.svc.cluster.local"
          - name: ODC_DEFAULT_DB_PORT
            value: "6432"
          - name: ODC_DEFAULT_DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: odc
                key: username
          - name: ODC_DEFAULT_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: odc
                key: password
          - name: ODC_DEFAULT_DB_DATABASE
            value: "odc_index"
          - name: ODC_DEFAULT_INDEX_DRIVER
            value: "postgis"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
